name: Rust security core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml
      # P7 native ABI: lint, test (in-process and subprocess-isolated), and build the supported
      # release artifact.
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Native ABI tests
        shell: bash
        run: |
          # GitHub runs bash with -e; keep going after a failed run to report it.
          set +e -uo pipefail
          cargo test --manifest-path core/Cargo.toml --features native-abi --lib abi::tests \
            2>&1 | tee abi-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Job logs need a signed-in viewer; also publish the failures in the run summary
            # and as annotations.
            (grep -aE 'FAILED|panicked at|left:|right:|^child |exit code|error' abi-tests.log \
              | head -n 30; echo '--- tail ---'; tail -n 25 abi-tests.log) \
              | tr -d '\r' > abi-failure.txt
            { echo '### Native ABI test failure'; echo '```'; cat abi-failure.txt; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error::${line//::/ }"
            done < <(grep -aE 'FAILED|panicked at' abi-failure.txt | head -n 8)
          fi
          exit "$status"
      # TEMPORARY diagnostic: repeat the native ABI tests to capture an intermittent failure.
      - name: Native ABI test repetition (diagnostic)
        shell: bash
        run: |
          set +e
          for i in 1 2 3 4 5 6; do
            cargo test --manifest-path core/Cargo.toml --features native-abi --lib abi::tests \
              > rep.log 2>&1
            status=$?
            echo "repetition $i: $status" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              { echo '```'; grep -aE 'FAILED|panicked at|left:|right:|^child |exit code|error|assert' rep.log \
                | head -n 60 | tr -d '\r'; echo '--- tail ---'; tail -n 40 rep.log | tr -d '\r'; echo '```'; } \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - run: cargo build --manifest-path core/Cargo.toml --release --features native-abi
      - name: Check native ABI artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s core/target/release/sas_pairing_core.dll
          test -s core/target/release/sas_pairing_core.dll.lib

  unsupported-platform-fails-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml
      # The native ABI compiles here too; this is not a claim of platform support (pairing
      # operations, added later, still fail closed on unsupported platforms).
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Native ABI tests
        shell: bash
        run: |
          # GitHub runs bash with -e; keep going after a failed run to report it.
          set +e -uo pipefail
          cargo test --manifest-path core/Cargo.toml --features native-abi --lib abi::tests \
            2>&1 | tee abi-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Job logs need a signed-in viewer; also publish the failures in the run summary
            # and as annotations.
            (grep -aE 'FAILED|panicked at|left:|right:|^child |exit code|error' abi-tests.log \
              | head -n 30; echo '--- tail ---'; tail -n 25 abi-tests.log) \
              | tr -d '\r' > abi-failure.txt
            { echo '### Native ABI test failure'; echo '```'; cat abi-failure.txt; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error::${line//::/ }"
            done < <(grep -aE 'FAILED|panicked at' abi-failure.txt | head -n 8)
          fi
          exit "$status"
      # P7.2: a valid authority registration through the real export enters the core and fails
      # closed with SAS_PAIRING_UNSUPPORTED_PLATFORM; nothing is faked.
      - name: Native ABI authority registration fails closed
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/Cargo.toml --features native-abi --lib \
            abi::tests::authority::authority_registration_fails_closed_on_unsupported_platforms \
            -- --exact | tee unsupported-authority.log
          grep -F 'test result: ok. 1 passed' unsupported-authority.log
      # P7.4: a structurally valid listener attach fails closed with
      # SAS_PAIRING_UNSUPPORTED_PLATFORM and leaves the caller's socket slot unchanged; no
      # Windows networking code exists here.
      - name: Native ABI listener attach fails closed
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/Cargo.toml --features native-abi --lib \
            abi::tests::listener::attach_fails_closed_on_unsupported_platforms \
            -- --exact | tee unsupported-listener.log
          grep -F 'test result: ok. 1 passed' unsupported-listener.log
      - run: cargo build --manifest-path core/Cargo.toml --release --features native-abi
      - name: Native ABI refuses panic = "abort"
        shell: bash
        run: |
          set -uo pipefail
          if CARGO_PROFILE_RELEASE_PANIC=abort cargo build --manifest-path core/Cargo.toml \
              --release --features native-abi > abort-build.log 2>&1; then
            echo "native-abi built with panic = abort; the containment guard is missing"
            exit 1
          fi
          grep -F 'the `native-abi` feature requires panic = "unwind"' abort-build.log
