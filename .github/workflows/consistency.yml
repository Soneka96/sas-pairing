name: Repository consistency

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files and public status
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE docs/architecture.md docs/threat-model.md docs/protocol-status.md docs/decisions/README.md ai/context/project.md core/README.md dart/README.md dotnet/README.md vectors/README.md tooling/README.md .github/pull_request_template.md .github/ISSUE_TEMPLATE/config.yml; do
            test -s "$file"
          done
          grep -Fq 'MIT OR Apache-2.0' README.md
          grep -Fq 'has not been independently audited' README.md
          grep -Fq 'Do not use this project to protect production systems yet.' README.md
          grep -Fq 'MIT License' LICENSE-MIT
          grep -Fq 'Apache License' LICENSE-APACHE
