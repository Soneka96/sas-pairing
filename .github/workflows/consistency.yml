name: Repository consistency

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files and public status
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE docs/architecture.md docs/threat-model.md docs/protocol-status.md docs/decisions/README.md ai/context/project.md core/README.md dart/README.md dotnet/README.md vectors/README.md tooling/README.md docs/p7-native-abi/README.md docs/p7-native-abi/decisions.md docs/p7-native-abi/abi-contract.md docs/p7-native-abi/abi-v1-manifest.md docs/p8-dart-package/README.md docs/p8-dart-package/decisions.md docs/p8-dart-package/final-closure.md docs/p9-dotnet-package/README.md docs/p9-dotnet-package/decisions.md dotnet/SasPairing.sln dotnet/global.json dotnet/src/SasPairing/SasPairing.csproj dart/CHANGELOG.md dart/LICENSE-MIT dart/LICENSE-APACHE tooling/package_dart_native.py core/include/sas_pairing.h .github/pull_request_template.md .github/ISSUE_TEMPLATE/config.yml; do
            test -s "$file"
          done
          grep -Fq 'MIT OR Apache-2.0' README.md
          grep -Fq 'no qualified professional audit or formal verification is claimed' README.md
          grep -Fq 'This selection does not establish production security or approve production use.' README.md
          grep -Fq 'Do not use this project to protect production systems.' README.md
          grep -Fq 'MIT License' LICENSE-MIT
          grep -Fq 'Apache License' LICENSE-APACHE
      # Every internal Markdown link and anchor in the repository resolves (P7.7).
      - name: Check Markdown links and anchors
        run: python3 tooling/check_markdown_links.py
      # P8-D-006: the packaging tool (synthetic PE fixtures; the real-DLL tests run in the
      # Windows Dart job) and the P8 distribution, package, workflow, and documentation guards.
      - name: Distribution contract and packaging tool tests
        run: python3 -m unittest discover -s tooling/tests -v
