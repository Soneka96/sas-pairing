name: Dart package

# P8 Dart package (dart/): the raw bindings of the frozen native ABI v1 and the
# process-lifetime loader, checked against a real native artifact built from this commit
# (P8-D-001). Windows is the supported pairing platform; on Linux the same ABI v1 library
# loads and binds, but pairing operations fail closed (no Linux pairing support is claimed).

on:
  push:
    paths:
      - 'dart/**'
      - 'core/include/sas_pairing.h'
      - 'core/src/**'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'
      - 'docs/p7-native-abi/abi-v1-manifest.md'
      - 'tooling/check_abi_exports.py'
      - '.github/workflows/dart-package.yml'
  pull_request:
    paths:
      - 'dart/**'
      - 'core/include/sas_pairing.h'
      - 'core/src/**'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'
      - 'docs/p7-native-abi/abi-v1-manifest.md'
      - 'tooling/check_abi_exports.py'
      - '.github/workflows/dart-package.yml'

permissions:
  contents: read

jobs:
  dart-package:
    name: dart-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: sas_pairing_core.dll
            python: python
          - os: ubuntu-latest
            artifact: libsas_pairing_core.so
            python: python3
    env:
      SAS_PAIRING_NATIVE_LIBRARY: ${{ github.workspace }}/core/target/release/${{ matrix.artifact }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The exact SDK the committed bindings were generated and formatted with.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart --version
      - name: dart pub get
        working-directory: dart
        run: dart pub get
      - name: dart format
        working-directory: dart
        run: dart format --output=none --set-exit-if-changed .
      - name: dart analyze
        working-directory: dart
        run: dart analyze --fatal-infos
      # The committed bindings must regenerate byte-for-byte from the frozen header.
      - name: Install libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Regenerate the raw bindings (ffigen) and require no diff
        working-directory: dart
        run: |
          set -euo pipefail
          dart run ffigen --config ffigen.yaml
          git status --porcelain -- .
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"
      - name: Build the native ABI v1 artifact
        run: cargo build --manifest-path core/Cargo.toml --release --features native-abi
      - name: Native ABI export audit
        run: ${{ matrix.python }} tooling/check_abi_exports.py --library "$SAS_PAIRING_NATIVE_LIBRARY" --expect manifest
      # Every Dart test, with the real artifact supplied explicitly (CI=true makes a missing
      # artifact a failure, never a skip).
      - name: dart test
        working-directory: dart
        run: |
          set -euo pipefail
          dart test --reporter expanded | tee dart-test.log
          grep -F 'All tests passed!' dart-test.log
      # The P8.1 native success criterion as its own step: the real artifact loads through the
      # process loader, all 25 frozen symbols resolve by exact name, and the ABI version is 1.
      - name: Real native ABI v1 smoke (symbols and version)
        working-directory: dart
        run: |
          set -euo pipefail
          dart test test/native_artifact_test.dart --reporter expanded | tee native-smoke.log
          grep -F 'the real artifact exports all 25 frozen symbols by their exact names' native-smoke.log
          grep -F 'All tests passed!' native-smoke.log
      # P8 must not change the frozen core: the ABI v1 freeze consistency tests stay green.
      - name: Native ABI v1 freeze consistency
        run: |
          set -euo pipefail
          cargo test --manifest-path core/Cargo.toml --features native-abi --lib \
            abi::tests::freeze | tee freeze.log
          grep -E 'test result: ok\. [1-9][0-9]* passed' freeze.log
