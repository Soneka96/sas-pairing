# CI runs `dart analyze --fatal-infos`: every error, warning, and info fails the build,
# including in the generated bindings (which are analyzed, not excluded).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
